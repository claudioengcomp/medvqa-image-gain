# Qwen2.5-VL-7B (model QWEN25VL = Qwen/Qwen2.5-VL-7B-Instruct, revision cc594898137f460bfe9f0759e9844b3ce807cfb5): same recipe as QWEN2VL_text_decoder_only.yaml of this benchmark; only model, run_name/wandb_run_name, outputs_dir, results_json_dir and train.checkpoint_dir differ.
# v7_txt (2026-10-09): text-only arm -- copy of the YAML of the published frozen row
# (med_vlm/configs/qwen2vl_lora_heal.yaml),
# changing only: data.no_image, peft_config.target_modules (LoRA only on the language model), train.max_length (8192/2048 -> 1024,
# without image tokens), checkpoint_every/checkpoint_dir (intermediate states in tmp/v7) and the output paths.
run_name: qwen25vl_lora_txt_heal
model: QWEN25VL
dataset: HEAL
peft: LORA
peft_config:
  r: 16
  lora_alpha: 32
  target_modules: ^.*model\.layers\.\d+\.self_attn\.(q|k|v|o)_proj$
  task_type: CAUSAL_LM
data:
  no_image: true
train:
  lr: 2e-4
  warmup_ratio: 0.05
  epochs: 3
  batch_size: 4
  grad_accum_steps: 4
  max_length: 1024
  gradient_checkpointing: true
  compile: true
  eval_every: 5000
  checkpoint_every: 15000
  checkpoint_dir: ${MEDVQA_ROOT}/v7_txt/article_runs/qwen25vl7b/ckpt_int
eval:
  batch_size: 2
  max_new_tokens: 64
logging:
  wandb_project: "med-vlm"
  wandb_run_name: qwen25vl_lora_txt_heal
outputs_dir: ${MEDVQA_ROOT}/v7_txt/article_runs/qwen25vl7b
results_json_dir: ${MEDVQA_ROOT}/v7_txt/article_runs/qwen25vl7b/logs

# Image preprocessing applied once at dataset load (cached). No effect under no_image (kept identical to the published config).
preprocessing:
  denoise: true
  denoise_method: "gaussian"
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]

# Online training-time augmentation (applied per batch, training only). No effect under no_image.
augmentation:
  enabled: true
  rotation_degrees: 5
  brightness_range: [0.85, 1.15]
  contrast_range: [0.85, 1.15]
