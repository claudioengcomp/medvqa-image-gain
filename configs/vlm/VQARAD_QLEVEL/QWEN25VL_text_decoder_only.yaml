# Qwen2.5-VL-7B (model QWEN25VL = Qwen/Qwen2.5-VL-7B-Instruct, revision cc594898137f460bfe9f0759e9844b3ce807cfb5): same recipe as QWEN2VL_text_decoder_only.yaml of this benchmark; only model, run_name/wandb_run_name, outputs_dir, results_json_dir and train.checkpoint_dir differ.
# vqarad_question_split (2026-10-19): copy of qwen2vl_lora_txt_vqarad_rediv.yaml (sha256 5e55f8f9c3d82e4b); only the name and data.arrows (split by question) change.
run_name: qwen25vl_lora_txt_vqarad_qlevel
model: QWEN25VL
dataset: VQA_RAD
peft: LORA
peft_config:
  r: 16
  lora_alpha: 32
  target_modules: ^.*model\.layers\.\d+\.self_attn\.(q|k|v|o)_proj$
  task_type: CAUSAL_LM
data:
  no_image: true
  arrows:
    train: ${MEDVQA_ROOT}/v7_txt/article_runs/data/vqarad_qlevel/vqa_vqa_rad_train.arrow
    validation: ${MEDVQA_ROOT}/v7_txt/article_runs/data/vqarad_qlevel/vqa_vqa_rad_val.arrow
    test: ${MEDVQA_ROOT}/v7_txt/article_runs/data/vqarad_qlevel/vqa_vqa_rad_test.arrow
train:
  lr: 2e-4
  warmup_ratio: 0.05
  epochs: 3
  batch_size: 4
  grad_accum_steps: 8
  max_length: 1024
  gradient_checkpointing: true
  compile: true
  eval_every: 5000
  checkpoint_every: 15000
  checkpoint_dir: ${MEDVQA_ROOT}/v7_txt/article_runs/qwen25vl7b/ckpt_int
eval:
  batch_size: 4
  split: validation
  max_new_tokens: 64
logging:
  wandb_project: med-vlm
  wandb_run_name: qwen25vl_lora_txt_vqarad_qlevel
outputs_dir: ${MEDVQA_ROOT}/v7_txt/article_runs/qwen25vl7b
results_json_dir: ${MEDVQA_ROOT}/v7_txt/article_runs/qwen25vl7b/logs
preprocessing:
  denoise: true
  denoise_method: gaussian
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid_size:
  - 8
  - 8
augmentation:
  enabled: true
  rotation_degrees: 5
  brightness_range:
  - 0.85
  - 1.15
  contrast_range:
  - 0.85
  - 1.15
