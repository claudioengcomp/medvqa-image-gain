# v7_mimic (2026-10-13): copy of v7_txt/configs/smolvlm2_lora_txt_heal.yaml (text-only arm; LoRA only on the LM, regex text_model.layers; max_length 1024), changing only dataset: MIMIC, run_name/wandb_run_name, checkpoint_dir and the output paths (like qwen2vl_lora_txt_mimic.yaml).
run_name: smolvlm2_lora_txt_mimic
model: SMOLVLM
dataset: MIMIC
peft: LORA
peft_config:
  r: 16
  lora_alpha: 32
  target_modules: ^.*text_model\.layers\.\d+\.self_attn\.(q|k|v|o)_proj$
  task_type: CAUSAL_LM
data:
  no_image: true
train:
  lr: 2e-4
  warmup_ratio: 0.05
  epochs: 3
  batch_size: 4
  grad_accum_steps: 4
  max_length: 1024
  gradient_checkpointing: true
  compile: false
  eval_every: 5000
  checkpoint_every: 15000
  checkpoint_dir: ${MEDVQA_ROOT}/tmp/v7/checkpoints_mimic
eval:
  batch_size: 2
  max_new_tokens: 64
logging:
  wandb_project: "med-vlm"
  wandb_run_name: "smolvlm2_lora_txt_mimic"
outputs_dir: ${MEDVQA_ROOT}/v7_mimic
results_json_dir: ${MEDVQA_ROOT}/v7_mimic/logs

# Image preprocessing applied once at dataset load (cached). Sem efeito sob no_image (mantido igual ao publicado).
preprocessing:
  denoise: true
  denoise_method: "gaussian"
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]

# Online training-time augmentation (applied per batch, training only). Sem efeito sob no_image.
augmentation:
  enabled: true
  rotation_degrees: 5
  brightness_range: [0.85, 1.15]
  contrast_range: [0.85, 1.15]
